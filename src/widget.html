<!doctype html>
<html lang="en" style=" background: transparent; ">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container" style=" padding: 0; ">
      <div id="stars"></div>
      <div class="widget-container">
        <div class="widget-container-inner">
          <div class="timer-container">
            <svg class="timer-svg" viewBox="0 0 100 100">
              <circle class="timer-bg" cx="50" cy="50" r="40" />
              <circle class="timer-progress" id="progress-circle" cx="50" cy="50" r="40" />
            </svg>
            <div class="timer-inner">
              <div id="timer-text"><span id="timer-hours">0</span>:<span id="timer-minutes">10</span></div>
              <button class="icon-button" id="snooze-button"><img class="icon" src="/assets/snooze.svg" title="Snooze" /></button>
            </div>
          </div>
          <h1 id="widget-title"></h1>
        </div>
        <button class="icon-button" id="back-button"><img class="icon" src="/assets/back.svg" title="Back" /></button>
      </div>
    </main>
  </body>
</html>

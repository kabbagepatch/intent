<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1 id="greeting">Good Morning!</h1>
      <form id="form">
        <label for="intent-input" id="intent-label">What are we up to today</label>
        <input id="intent-input" name="intent" required autocomplete="off" placeholder="Enter your intent..." />
        <p id="time-label">How long do you plan to spend on it</p>
        <div id="time-input">
          <input id="hours-input" name="hours" type="number" step="1" min="0" autocomplete="off" placeholder="0" />
          <label for="hours-input">h</label>
          <input id="minutes-input" name="minutes" type="number" step="1" min="0" autocomplete="off" placeholder="0" />
          <label for="minutes-input">m</label>
        </div>
        <button id="submit-button" type="submit">Start</button>
      </form>
      <div id="stars"></div>
    </main>
  </body>
</html>
